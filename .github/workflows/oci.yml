name: OCI ARM Auto Creator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --prefer-dist
          else
            echo "composer.json not found, skipping."
          fi

      - name: Create Private Key file
        run: |
          php -r '
            $b64 = trim(getenv("OCI_PK"));
            $key = base64_decode($b64);
            file_put_contents("akekaphote@gmail.com-2026-11-06T12_26_12.239Z.pem", $key);
          '
        env:
          OCI_PK: ${{ secrets.OCI_PRIVATE_KEY }}
          
      - name: Create .env configuration
        run: |
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" > .env
          echo "OCI_USER_OCID=${{ secrets.OCI_USER_OCID }}" >> .env
          echo "OCI_TENANCY_OCID=${{ secrets.OCI_TENANCY_OCID }}" >> .env
          echo "OCI_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}" >> .env
          echo "OCI_PRIVATE_KEY_PATH=akekaphote@gmail.com-2026-11-06T12_26_12.239Z.pem" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}" >> .env
          echo "OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}" >> .env
          echo "OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}" >> .env
          echo "OCI_OCPUS=${{ secrets.OCI_OCPUS }}" >> .env
          echo "MEMORY_IN_GBS=${{ secrets.MEMORY_IN_GBS }}" >> .env

      - name: Run OCI Host Creator Script
        run: |
          # วนลูป 60 ครั้ง (ครั้งละ 15 วินาที รวมเวลาทำงานประมาณ 15 นาทีต่อรอบ)
          for i in {1..60}; do
            echo "Attempt $i..."
            OUTPUT=$(php index.php 2>&1)
            echo "$OUTPUT"
            
            # ตรวจสอบว่าสร้างสำเร็จจริง (ไม่มีคำว่า Error, Capacity และ timed out)
            if [[ "$OUTPUT" != *"Error"* ]] && [[ "$OUTPUT" != *"Capacity"* ]] && [[ "$OUTPUT" != *"timed out"* ]]; then
              echo "Success! Host created."
              break
            fi
            
            sleep 15
          done
        
