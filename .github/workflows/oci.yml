name: OCI ARM Auto Creator

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --prefer-dist
          else
            echo "composer.json not found, skipping."
          fi

      - name: Create Private Key file
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > key.pem

      - name: Create .env configuration
        run: |
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" >> .env
          echo "OCI_USER_OCID=${{ secrets.OCI_USER_OCID }}" >> .env
          echo "OCI_TENANCY_OCID=${{ secrets.OCI_TENANCY_OCID }}" >> .env
          echo "OCI_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}" >> .env
          echo "OCI_PRIVATE_KEY_PATH=key.pem" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}" >> .env
          echo "OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}" >> .env
          echo "OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}" >> .env
          echo "OCI_OCPUS=${{ secrets.OCI_OCPUS }}" >> .env
          echo "MEMORY_IN_GBS=${{ secrets.MEMORY_IN_GBS }}" >> .env

      - name: Run OCI Host Creator Script
        run: php index.php
